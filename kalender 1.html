    <!-- FullCalendar CSS -->

</head>
<body>
<!-- HEADER -->
<header class="header">
    <div class="container flex-row header-container">
        <div class="header__logo">
            <a href="tes_carousel.html">
                <img src="assets/img/logo1.png" alt="LogoZephyrus">
            </a>
        </div>
        
        <div class="header__nav-wrapper">
            <ul class="header__menu-desktop">
                <li><a href="tes_carousel.html">Beranda</a></li>
                <li><a href="../Data.html">Data</a></li>
                <li><a href="../artikel/art.html">Artikel</a></li>
            </ul>
            
            <button class="hamburger-btn" id="hamburger-trigger" aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <div class="hamburger-dropdown" id="hamburger-target">
            <ul>
                <li><a href="profile.html" class="sub-menu-item">Profil</a></li>
                <li><a href="#kalender" class="sub-menu-item active-page">Kalender</a></li>

</header>
    <section id="calendar-section">

    <div class="container">

        <h2 class="section-heading">
            Kalender Kegiatan
        </h2>

        <div class="calendar-card">

            <div id="calendar"></div>

        </div>

    </div>

</section>

<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function(){

    const calendarEl = document.getElementById("calendar");

    const calendar = new FullCalendar.Calendar(calendarEl,{

        initialView:"dayGridMonth",

        locale:"id",

        height:"auto",

        headerToolbar:{
            left:"prev,next today",
            center:"title",
            right:"dayGridMonth,timeGridWeek,listMonth"
        },

        buttonText:{
            today:"Hari Ini",
            month:"Bulan",
            week:"Minggu",
            list:"Agenda"
        },

        events:[
            {
                title:"Rapat Pengurus",
                start:"2026-08-15"
            },
            {
                title:"Workshop WRF-Hydro",
                start:"2026-08-20"
            },
            {
                title:"Pengabdian Majalaya",
                start:"2026-08-25",
                end:"2026-08-27"
            },
            {
                title:"Maintenance Z-ONA",
                start:"2026-09-03"
            }
        ]

    });

    calendar.render();

});

</script>
 <script>
    document.addEventListener("DOMContentLoaded", function() {
        const trigger = document.getElementById("hamburger-trigger");
        const dropdown = document.getElementById("hamburger-target");

        if (trigger && dropdown) {
            trigger.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                dropdown.classList.toggle("active");
                
                // Variasi ganti icon bars ke silang (X) pas kebuka
                const icon = trigger.querySelector("i");
                if (dropdown.classList.contains("active")) {
                    icon.className = "fas fa-times";
                } else {
                    icon.className = "fas fa-bars";
                }
            });

            // Klik di luar dropdown akan otomatis nutup
            document.addEventListener("click", function(e) {
                if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove("active");
                    trigger.querySelector("i").className = "fas fa-bars";
                }
            });
        }
    });
</script>
  
</body>
</html>
