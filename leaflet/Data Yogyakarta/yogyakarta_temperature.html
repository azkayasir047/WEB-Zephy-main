<!DOCTYPE html>
<html>
<head>
  <title>Temperatur Udara Kota Yogyakarta (Prakiraan 5 hari)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="shortcut icon" type="image/png" href="https://drive.google.com/thumbnail?id=1o1QQHMqbIHo5-CVkgdoQgP6VCNlzU23s">
</head>
<body>
  <h1>Temperatur Udara Kota Yogyakarta (Prakiraan 5 hari)</h1>
  <canvas id="temperatureChart"></canvas>
  <script>
    const apiKey = 'fefda776b66c743280661d5abc123c22'; // API key
    const cityId = 1621177; // Yogyakarta city ID

    async function getWeatherData() {
      const url = `https://api.openweathermap.org/data/2.5/forecast?lat=-7.783&lon=110.361&appid=${apiKey}&units=metric`;
      const response = await fetch(url);
      const data = await response.json();
      return data;
    }

    async function renderChart() {
      const weatherData = await getWeatherData();
      const temperatures = weatherData.list.map(hour => hour.main.temp);
      const tempsMin = weatherData.list.map(hour => hour.main.temp_min);
      const tempsMax = weatherData.list.map(hour => hour.main.temp_max);
      const labels = weatherData.list.map(hour => {
        const date = new Date(hour.dt * 1000);
        return `${date.toLocaleDateString()} ${date.toLocaleTimeString('short')}`;
      });

      const ctx = document.getElementById('temperatureChart').getContext('2d');
      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Temperature (°C)',
              data: temperatures,
              borderColor: 'rgba(255, 99, 132, 1)',
              borderWidth: 1,
              fill: false
            },
            {
              label: 'Min Temp (°C)',
              data: tempsMin,
              borderColor: 'rgba(54, 162, 235, 1)',
              borderWidth: 1,
              fill: false,
            },
            {
              label: 'Max Temp (°C)',
              data: tempsMax,
              borderColor: 'rgba(255, 206, 86, 1)',
              borderWidth: 1,
              fill: false,
            }
          ]
        },
        options: {
          scales: {
            xAxes: [{
              ticks: {
                autoSkip: false,
                maxRotation: 90,
                minRotation: 90
              }
            }],
            yAxes: [{
              ticks: {
                beginAtZero: true
              }
            }]
          }
        }
      });
    }

    renderChart();
  </script>
</body>
</html>
