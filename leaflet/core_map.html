<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet</title>
    <link rel="shortcut icon" type="image/png"
        href="https://drive.google.com/thumbnail?id=1o1QQHMqbIHo5-CVkgdoQgP6VCNlzU23s">

    <!-- Inisiasi Leaflet Package-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="leaflet.js"></script>

    <link rel="stylesheet" type="text/css" href="leaflet-openweathermap.css" />
    <script type="text/javascript" src="leaflet-openweathermap.js"></script>

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        body {
            padding: 0;
            margin: 0
        }
    </style>
</head>

<body>
    <div id="map"></div>
</body>

</html>

<script>
    // Inisialisasi Map
    var map = L.map('map').setView([-7.0991359852096165, 107.74358510695362], 12);

    // Pendefinisian tile layers
    /// Base map
    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
    });
    var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        maxZoom: 17
    });
    var dark = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.{ext}', {
        minZoom: 0,
        maxZoom: 20,
        ext: 'png'
    });
    var grey = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.{ext}', {
        minZoom: 0,
        maxZoom: 20,
        attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        ext: 'png'
    });
    var nightlight = L.tileLayer('https://map1.vis.earthdata.nasa.gov/wmts-webmerc/VIIRS_CityLights_2012/default/{time}/{tilematrixset}{maxZoom}/{z}/{y}/{x}.{format}', {
        attribution: 'Imagery provided by services from the Global Imagery Browse Services (GIBS), operated by the NASA/GSFC/Earth Science Data and Information System (<a href="https://earthdata.nasa.gov">ESDIS</a>) with funding provided by NASA/HQ.',
        bounds: [[-85.0511287776, -179.999999975], [85.0511287776, 179.999999975]],
        minZoom: 1,
        maxZoom: 8,
        format: 'jpg',
        time: '',
        tilematrixset: 'GoogleMapsCompatible_Level'
    });
    var sat = L.tileLayer('http://{s}.google.com/vt?lyrs=s&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    });
    var street = L.tileLayer('http://{s}.google.com/vt?lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    });
    var terrain = L.tileLayer('http://{s}.google.com/vt?lyrs=p&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    });
    var hyb = L.tileLayer('http://{s}.google.com/vt?lyrs=s,h&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    });

    /// Layer addition
    var api = "fefda776b66c743280661d5abc123c22"
    var cloud = L.tileLayer('http://{s}.tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid={apiKey}', {
        maxZoom: 19,
        apiKey: api,
        opacity: 1
    });
    var pressure = L.tileLayer('http://{s}.tile.openweathermap.org/map/pressure_new/{z}/{x}/{y}.png?appid={apiKey}', {
        maxZoom: 19,
        apiKey: api,
        opacity: 1
    });
    var wind = L.tileLayer('http://{s}.tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid={apiKey}', {
        maxZoom: 19,
        apiKey: api,
        opacity: 1
    });
    var preci = L.tileLayer('http://{s}.tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid={apiKey}', {
        maxZoom: 19,
        apiKey: api,
        opacity: 1
    });
    var temp = L.tileLayer('http://{s}.tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid={apiKey}', {
        maxZoom: 19,
        apiKey: api,
        opacity: 1
    });

    // var OWM_clouds = L.OWM.clouds({showLegend: true, opacity: 0.7, appId: api});
    var OWM_cloudscls = L.OWM.cloudsClassic({ showLegend: true, opacity: 0.7, appId: api });
    // var OWM_precipitation = L.OWM.precipitation({showLegend: true, opacity: 0.7, appId: api});
    var OWM_precipitationcls = L.OWM.precipitationClassic({ showLegend: true, opacity: 0.7, appId: api });
    // var OWM_rain = L.OWM.rain({showLegend: true, opacity: 0.7, appId: api});
    var OWM_raincls = L.OWM.rainClassic({ showLegend: true, opacity: 0.7, appId: api });
    var OWM_snow = L.OWM.snow({ showLegend: true, opacity: 0.7, appId: api });
    var OWM_pressure = L.OWM.pressure({ showLegend: true, opacity: 0.7, appId: api });
    var OWM_pressurecntr = L.OWM.pressureContour({ showLegend: true, opacity: 0.7, appId: api });
    var OWM_temp = L.OWM.temperature({ showLegend: true, opacity: 0.7, appId: api });
    var OWM_wind = L.OWM.wind({ showLegend: true, opacity: 0.7, appId: api });

    var OWM_pressureleg = L.layerGroup([OWM_pressure, OWM_pressurecntr])


    // Menambahkan tile layers ke map
    /// Menampilkan default peta
    topo.addTo(map);

    // Pengelompokkan elemen
    /// Penambahan marker
    var marker_icon = L.icon({
    iconUrl: '../assets/img/marker.png',

    iconSize:     [50, 50], // size of the icon
    iconAnchor:   [0, 0], // point of the icon which will correspond to marker's location
    popupAnchor:  [0, 0] // point from which the popup should open relative to the iconAnchor
    });
    var ciharus_marker = L.marker([-7.0991359852096165, 107.74358510695362],{icon: marker_icon});
    ciharus_marker.addTo(map);
    // var Paseh_marker = L.marker([-7.1026, 107.7641]);
    // Paseh_marker.addTo(map);
    var onlimo_marker = L.marker([-7.127643986279048, 107.70159912692186],{icon: marker_icon});
    onlimo_marker.addTo(map);
    
    var sanding_marker = L.marker([-7.0693229, 107.7786956],{icon: marker_icon});
    sanding_marker.addTo(map);

    var bandungMarker = L.marker([-6.906288, 107.614509]);
    var cimahiMarker = L.marker([-6.880045, 107.541039]);
    var baleendahMarker = L.marker([-7.005306, 107.63133]);
    var jakartaMarker = L.marker([-6.205673, 106.814214]);
    var mark = L.layerGroup([bandungMarker, jakartaMarker, cimahiMarker, baleendahMarker])

    /// Penambahan peta dasar
    var baseMaps = {
        "OpenStreetMap": osm,
        "Topo OpenStreetMap": topo,
        //"Dark Stadia Map": dark,
        //"Grey Stadia Map": grey,
        "Night Light GIBS": nightlight,
        "Google Maps Satellite": sat,
        "Google Maps Streets": street,
        "Google Maps Terrain": terrain,
        "Google Maps Hybrid": hyb,
    };
    /// Penambahan overlay peta
    var overlayMaps = {
        // "<span style ='color: grey'>Clouds</span>": cloud,
        // "<span style ='color: grey'>Wind</span>": wind,
        // "<span style ='color: grey'>Sea Level Pressure</span>": pressure,
        // "<span style ='color: grey'>Temperature</span>": temp,
        // "<span style ='color: grey'>Precipitation</span>": preci,
        // "FORECAST": "",
        "Perawanan": OWM_cloudscls,
        "Curah Hujan": OWM_precipitationcls,
        // "Salju (with Legend)": OWM_snow,
        "Tekanan": OWM_pressureleg,
        "Temperatur": OWM_temp,
        "Angin": OWM_wind,
    };

    /// Penambahan Layer control
    var layerControl = L.control.layers(baseMaps, overlayMaps, { collapsed: true }).addTo(map);

    // Mark(er) <- Samain ama koordinat inisialisasi supaya load web-nya langsung ke Bandung

    var jawabarat_marker = L.marker([-6.88356,107.59733]).addTo(map)
    // var banten_marker = L.marker([-6.11185,106.11000]). addTo(map)
    var jakarta_marker = L.marker([-6.27036,106.88926]). addTo(map)
    var yogyakarta_marker = L.marker([-7.73100,110.35400]). addTo(map)
    // var jawatengah_marker = L.marker([-6.97683,110.37780]). addTo(map)
    // var jawatimur_marker = L.marker([-8.21500,114.35530]). addTo(map)


    // Pop up 3 titik
    // banten_marker.bindPopup(
    //     "<h1>Stasiun Meteorologi Maritim Serang</h1>\.");
    jakarta_marker.bindPopup(
        "<h1>Stasiun Halim Perdana Kusuma Jakarta</h1><br></a><span><b>Variabel Meteorologi</b></span><i class='bi bi-chevron-down'></i></a>\
        <ul><li><a href='Data Jakarta/jakarta_precipitation.html'>Hujan dan Peluang Hujan</a></li>\
	    <li><a href='Data Jakarta/jakarta_temperature.html'>Temperatur Udara</a></li>\
            <li><a href='Data Jakarta/jakarta_humidity.html'>Kelembapan Udara</a></li>\
            <li><a href='Data Jakarta/jakarta_pressure.html'>Tekanan Udara</a></li>\
            <li><a href='Data Jakarta/jakarta_windspeed.html'>Kecepatan Angin</a></li>\
            <li><a href='Data Jakarta/jakarta_cloudiness.html'>Tutupan Awan/Keadaan Mendung</a></li>\.");
    // Paseh_marker.bindPopup(
    //     "<h1>Paseh</h1><h2>5 Days Forecast</h2></a><b>Variabel Meteorologi</b><i class='bi bi-chevron-down'></i></a>\
    //     <ul><li><a href='Data Paseh/Paseh_precipitation.html'>Hujan dan Peluang Hujan</a></li>\
	//     <li><a href='Data Paseh/Paseh_temperature.html'>Temperatur Udara</a></li>\
    //         <li><a href='Data Paseh/Paseh_humidity.html'>Kelembapan Udara</a></li>\
    //         <li><a href='Data Paseh/Paseh_pressure.html'>Tekanan Udara</a></li>\
    //         <li><a href='Data Paseh/Paseh_windspeed.html'>Kecepatan Angin</a></li>\
    //         <li><a href='Data Paseh/Paseh_cloudiness.html'>Tutupan Awan/Keadaan Mendung</a></li>\.");
    yogyakarta_marker.bindPopup(
        "<h1>Stasiun Klimatologi DI Yogyakarta</h1><br></a><span><b>Variabel Meteorologi</b></span><i class='bi bi-chevron-down'></i></a>\
        <ul><li><a href='Data Yogyakarta/yogyakarta_precipitation.html'>Hujan dan Peluang Hujan</a></li>\
	    <li><a href='Data Yogyakarta/yogyakarta_temperature.html'>Temperatur Udara</a></li>\
            <li><a href='Data Yogyakarta/yogyakarta_humidity.html'>Kelembapan Udara</a></li>\
            <li><a href='Data Yogyakarta/yogyakarta_pressure.html'>Tekanan Udara</a></li>\
            <li><a href='Data Yogyakarta/yogyakarta_windspeed.html'>Kecepatan Angin</a></li>\
            <li><a href='Data Yogyakarta/yogyakarta_cloudiness.html'>Tutupan Awan/Keadaan Mendung</a></li>\.");
    jawabarat_marker.bindPopup(
        "<h1>Stasiun Geofisika Bandung</h1><br></a><span><b>Variabel Meteorologi</b></span><i class='bi bi-chevron-down'></i></a>\
            <ul><li><a href='Data Bandung/bandung_precipitation.html'>Hujan dan Peluang Hujan</a></li>\
	    <li><a href='Data Bandung/bandung_temperature.html'>Temperatur Udara</a></li>\
            <li><a href='Data Bandung/bandung_humidity.html'>Kelembapan Udara</a></li>\
            <li><a href='Data Bandung/bandung_pressure.html'>Tekanan Udara</a></li>\
            <li><a href='Data Bandung/bandung_windspeed.html'>Kecepatan Angin</a></li>\
            <li><a href='Data Bandung/bandung_cloudiness.html'>Tutupan Awan/Keadaan Mendung</a></li>\.");
        // Pop up
    ciharus_marker.bindPopup(
    "<h1>Sasak Ciharus</h1><br><iframe width=auto height=110% style='border: 1px solid #cccccc;' src='https://thingspeak.com/apps/matlab_visualizations/586561'></iframe>\.<br>");
    onlimo_marker.bindPopup(
    "<h1>Onlimo Cibangoak</h1><br><iframe width=auto height=110% style='border: 1px solid #cccccc;' src='https://thingspeak.com/apps/matlab_visualizations/581009'></iframe>\.<br>");
    sanding_marker.bindPopup(
    "<h1>Mushola Sanding</h1><br><iframe width=auto height=110% style='border: 1px solid #cccccc;' src=''></iframe>\.<br>");

    // Click
    var popup = L.popup();
    function onMapClick(e) {
        popup
            .setLatLng(e.latlng)
            .setContent("Koordinat dari titik yang Anda tekan yaitu " + e.latlng.toString())
            .openOn(map);
    }

    map.on('click', onMapClick);
</script>
