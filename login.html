<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Zephyrus</title>
    <link rel="icon" type="image/png" href="../assets/img/Logo Zephyrus.png">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<header class="header">
    <div class="container flex-row header-container">
        <div class="header__logo">
            <a href="tes_carousel.html">
                <img src="assets/img/logo1.png" alt="LogoZephyrus">
            </a>
        </div>
        
        <div class="header__nav-wrapper">
            <ul class="header__menu-desktop">
                <li><a href="tes_carousel.html">Beranda</a></li>
                <li><a href="Data.html">Data</a></li>
                <li><a href="artikel/art.html">Artikel</a></li>
            </ul>
            
            <button class="hamburger-btn" id="hamburger-trigger" aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <div class="hamburger-dropdown" id="hamburger-target">
          <ul>
              <li>
                  <a href="profile.html" class="sub-menu-item active-page">
                      Profil
                  </a>
              </li>

              <li>
                  <a href="kalender.html" class="sub-menu-item">
                      Kalender
                  </a>
              </li>

              <li id="usernameItem" style="display:none;">
                  <span class="user-info">
                      <i class="fas fa-user-circle"></i>
                      <span id="usernameText"></span>
                  </span>
              </li>

              <li>
                  <a id="loginItem"
                    href="login.html"
                    class="sub-menu-item">
                      Login
                  </a>
              </li>

          </ul>
        </div>
    </div>
</header>

<div class="overlay">

    <div class="login-card">

        <img src="assets/img/logo1.png" class="logo">

        <h1>LOGIN</h1>

        <p class="subtitle">
            Masuk untuk mengakses sebagai admin.
        </p>

        <form id="loginForm">

            <div class="input-group">
                <i class="fas fa-user"></i>
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>
            </div>

            <button type="submit">
                LOGIN
            </button>

        </form>

        <div class="footer-login">
            © BO Zephyrus 2026
        </div>

</div>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const username=document.getElementById("username").value;
    const password=document.getElementById("password").value;

    const response=await fetch("/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            username,
            password
        })

    });

    const data=await response.json();

    if(data.success){

        window.location.href="/dashboard";

    }else{

        alert(data.message);

    }

});

</script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const trigger = document.getElementById("hamburger-trigger");
        const dropdown = document.getElementById("hamburger-target");

        if (trigger && dropdown) {
            trigger.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                dropdown.classList.toggle("active");
                
                // Variasi ganti icon bars ke silang (X) pas kebuka
                const icon = trigger.querySelector("i");
                if (dropdown.classList.contains("active")) {
                    icon.className = "fas fa-times";
                } else {
                    icon.className = "fas fa-bars";
                }
            });

            // Klik di luar dropdown akan otomatis nutup
            document.addEventListener("click", function(e) {
                if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove("active");
                    trigger.querySelector("i").className = "fas fa-bars";
                }
            });
        }
    });
</script>

</body>
</html>
